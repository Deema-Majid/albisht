  /* =================== [5] المحاكمة =================== */
  var trial = null;
  var trialSession = 0;
  /* true إذا المحاكمة اللي بدأ فيها المؤقّت ما زالت هي الحالية */
  function alive(tr) { return !!tr && trial === tr; }
  function exitTrial() { trial = null; }
  var LETTERS = { ar: ['أ', 'ب', 'ج', 'د', 'هـ'], en: ['A', 'B', 'C', 'D', 'E'] };
  function startTrial(c, side) {
    trialSession++;
    trial = {
      id: trialSession, busy: false,
      c: c, side: side, idx: 0, answered: false, picks: [], openEv: null,
      order: c.stages.map(function (st) { return Lg.shuffle(st.options[side], Math.random); })
    };
    show('trial');
  }
  function trialScore() { return trial.picks.reduce(function (s, p) { return s + (p ? p.points : 0); }, 0); }

  renderers.trial = function (animate) {
    var scr = $('scr-trial');
    scr.textContent = '';
    if (!trial) return;
    var c = trial.c, st = c.stages[trial.idx], side = trial.side, total = c.stages.length;
    var steps = h('span', { class: 'steps', 'aria-hidden': 'true' });
    for (var i = 0; i < total; i++) steps.appendChild(h('i', { class: i < trial.idx + (trial.answered ? 1 : 0) ? 'done' : '' }));
    var scoreB = h('b', { id: 'scoreNum', text: String(trialScore()) });
    var plus = h('span', { class: 'plus', id: 'plus', 'aria-hidden': 'true' });
    scr.appendChild(h('div', { class: 'trial-top' }, [
      h('div', { class: 'who' }, [put(h('strong'), c.title), h('small', null, [t('yourClient', { name: '' }), put(h('span'), c.parties[side].name)])]),
      h('div', { class: 'meta' }, [
        h('div', { class: 'progress' }, [h('span', { text: t('stageOf', { n: trial.idx + 1, total: total }) }), steps]),
        h('span', { class: 'score' }, [t('points') + ' ', scoreB, ' / ' + (total * C.SCORING.maxPerStage), plus])
      ])
    ]));
    /* منصة القاضي والمطرقة */
    var gavel = document.createElementNS(NS, 'svg');
    gavel.setAttribute('class', 'gavel'); gavel.setAttribute('viewBox', '0 0 48 48');
    gavel.innerHTML = '<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="30" width="18" height="4" rx="1"/><rect x="5" y="34" width="24" height="4" rx="1"/></g>' +
      '<g class="gavel-arm"><path d="M42 40 L24 22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon points="25.5,10.8 31.2,16.5 18.5,29.2 12.8,23.5" fill="currentColor"/></g>';
    var bench = h('div', { class: 'bench', id: 'bench' }, [
      icon('scales'),
      h('div', null, [h('strong', { text: t('bench') }), h('span', { class: 'sub', text: t('benchSub') })]),
      h('span', { class: 'gavel-wrap', 'aria-hidden': 'true' }, [gavel, h('span', { class: 'ring' }), h('span', { class: 'ring r2' })])
    ]);
    scr.appendChild(bench);

    var stage = h('div', { class: 'stage', id: 'stage' });
    stage.appendChild(h('h2', { class: 'stage-name', id: 'stageName', tabindex: '-1', 'data-focus': true, text: L(C.STAGES[st.type]) }));
    var q = h('div', { class: 'question' });
    var opp = st.opponentLine && st.opponentLine[side];
    if (st.type === 'rebuttal' && opp && opp.ar) {
      q.appendChild(h('p', { class: 'opp' }, [t('opponentSays') + ' ', h('q', { loc: opp })]));
    }
    q.appendChild(h('p', { class: 'ask', loc: st.prompt[side] }));
    stage.appendChild(q);

    /* الأدلة: زر لكل دليل يفتح تفاصيله */
    if (c.evidence && c.evidence.length) {
      stage.appendChild(h('p', { class: 'evidence-title', text: t('evidenceAvail') }));
      var evRow = h('div', { class: 'evidence' });
      var evDetail = h('p', { class: 'ev-detail', id: 'evDetail', hidden: true });
      c.evidence.forEach(function (ev) {
        var open = trial.openEv === ev.id;
        evRow.appendChild(h('button', { class: 'ev', type: 'button', 'aria-expanded': String(open), 'aria-controls': 'evDetail',
          onclick: function () { trial.openEv = open ? null : ev.id; renderers.trial(false); var b = $('scr-trial').querySelectorAll('.ev')[c.evidence.indexOf(ev)]; if (b) b.focus(); }
        }, [icon('doc'), put(h('span'), ev.label)]));
        if (open) { put(evDetail, ev.detail); evDetail.hidden = false; }
      });
      stage.appendChild(evRow);
      stage.appendChild(evDetail);
    }

    var opts = h('div', { class: 'options', role: 'radiogroup', 'aria-label': t('optionsAria') });
    var picked = trial.picks[trial.idx];
    trial.order[trial.idx].forEach(function (o, k) {
      var b = h('button', { class: 'option', type: 'button', role: 'radio', style: '--i:' + k,
        'aria-checked': String(picked === o), 'aria-disabled': trial.answered ? 'true' : null,
        onclick: function () { choose(o, b); } }, [
        h('span', { class: 'letter', 'aria-hidden': 'true', text: LETTERS[state.lang][k] }),
        h('span', { class: 'opt-text', loc: o.text })
      ]);
      opts.appendChild(b);
    });
    stage.appendChild(opts);
    var slot = h('div', { id: 'verdictSlot', 'aria-live': 'polite' });
    stage.appendChild(slot);
    stage.appendChild(h('div', { class: 'btn-row' }, [h('button', { class: 'btn btn-ghost btn-small', type: 'button', text: t('leaveTrial'),
      onclick: function () { exitTrial(); show('browse'); } })]));
    scr.appendChild(stage);
    if (trial.answered) showJudge(picked, false);
    if (animate && !reduced()) restart(opts, 'enter');
  };

  function choose(o, btn) {
    if (!trial || trial.answered) return;
    trial.answered = true;
    trial.picks[trial.idx] = o;
    var scr = $('scr-trial');
    scr.querySelectorAll('.option').forEach(function (x) {
      x.setAttribute('aria-checked', x === btn ? 'true' : 'false');
      x.setAttribute('aria-disabled', 'true');
    });
    var stepsDone = scr.querySelectorAll('.steps i')[trial.idx];
    if (stepsDone) stepsDone.classList.add('done');
    if (reduced()) { showJudge(o, true); return; }
    var bench = $('bench'), tr = trial;
    restart(bench, 'strike');
    setTimeout(function () {             /* لحظة ضربة المطرقة */
      if (!alive(tr) || tr.picks[tr.idx] !== o) return;   /* خرج اللاعب أو تغيّرت المرحلة */
      var b = $('bench'), sc = $('scr-trial');
      if (b) restart(b, 'hit');
      if (sc) restart(sc, 'shake');
      showJudge(o, true);
    }, C.MOTION.gavelHit);
  }

  function countTo(el, from, to) {
    if (reduced()) { el.textContent = to; return; }
    restart(el, 'bump');
    var t0 = performance.now(), dur = C.MOTION.countUp;
    (function step(now) {
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function showJudge(o, fresh) {
    var slot = $('verdictSlot');
    if (!slot || !trial || current !== 'trial') return;
    var n = o.points, word = L(C.RATINGS[n]);
    var rating = h('span', { class: 'rating', role: 'img', 'aria-label': t('ratingAria', { word: word, n: n }) });
    for (var k = 0; k < 3; k++) {
      var s = icon(k < n ? 'mini-full' : 'mini-empty', k < n ? '' : 'empty');
      s.style.setProperty('--i', k);
      rating.appendChild(s);
    }
    rating.appendChild(h('span', { class: 'word r-' + n, 'aria-hidden': 'true', text: word }));
    var last = trial.idx === trial.c.stages.length - 1;
    var ev = null;
    if (o.evidenceId) (trial.c.evidence || []).forEach(function (e) { if (e.id === o.evidenceId) ev = e; });
    var nextBtn = h('button', { class: 'btn btn-primary btn-block', type: 'button', text: last ? t('showResult') : t('nextStage'), onclick: nextStage });
    slot.textContent = '';
    slot.appendChild(h('div', { class: 'verdict' + (fresh && !reduced() ? ' anim' : '') }, [
      h('div', { class: 'verdict-head' }, [h('strong', { text: t('judgeComment') }), rating]),
      h('p', null, [put(h('span'), o.judge), ' (' + t('plusPoints', { pts: count(n, 'points') }) + ')']),
      ev ? h('p', { class: 'used-ev' }, [t('usedEvidence', { label: '' }), put(h('span'), ev.label)]) : null,
      h('div', { class: 'next' }, [nextBtn])
    ]));
    if (fresh) {
      var scoreEl = $('scoreNum'), now = trialScore();
      if (scoreEl) countTo(scoreEl, now - n, now);
      var plus = $('plus');
      if (plus) { plus.textContent = '+' + n; if (!reduced()) restart(plus, 'go'); }
    }
  }

  function nextStage() {
    /* حماية: تجاهل الضغطة إذا ما فيه محاكمة، أو المرحلة ما انجابت، أو فيه انتقال شغّال */
    if (!trial || !trial.answered || trial.busy) return;
    if (trial.idx >= trial.c.stages.length - 1) { finishTrial(); return; }
    var tr = trial;
    tr.busy = true;
    function go() {
      tr.idx++; tr.answered = false; tr.openEv = null; tr.busy = false;
      renderers.trial(true);
      var sn = $('stageName'); if (sn) sn.focus({ preventScroll: true });
    }
    if (reduced()) { go(); window.scrollTo(0, 0); return; }
    var stage = $('stage');
    if (stage) stage.classList.add('turn-out');
    setTimeout(function () {
      if (!alive(tr) || current !== 'trial') return;   /* خرج اللاعب أثناء قلب الصفحة */
      go();
      var ns = $('stage');
      if (ns) restart(ns, 'turn-in');
      $('scr-trial').scrollIntoView({ block: 'start' });
    }, C.MOTION.pageTurn);
  }

  /* =================== [6] النتيجة =================== */
  var lastResult = null;
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function finishTrial() {
    if (!trial || !Lg.isCompleteTrial(trial.picks, trial.c.stages.length)) return;   /* ما ترسم نتيجة بمرحلة ناقصة */
    var points = trial.picks.map(function (p) { return p.points; });
    var res = Lg.computeResult(points, C.SCORING);
    var before = currentTitle(), winsBefore = winsNow();
    var rec = Lg.recordResult(state.completed, trial.c.id, trial.side, res.percent, today());
    save();
    var after = currentTitle();
    lastResult = { c: trial.c, side: trial.side, res: res, picks: trial.picks.slice(), rec: rec, newTitle: after.index > before.index ? after : null, winsBefore: winsBefore, winsAfter: winsNow() };
    trial = null;
    show('result');
  }

  renderers.result = function (animate) {
    var scr = $('scr-result');
    scr.textContent = '';
    if (!lastResult) return;
    var r = lastResult, c = r.c, res = r.res, v = c.verdict;
    if (!Lg.isCompleteTrial(r.picks, c.stages.length)) { lastResult = null; show('browse', { replace: true }); return; }
    var other = r.side === 'A' ? 'B' : 'A';
    var head = h('div', { class: 'result-head' + (animate && !reduced() ? ' anim' : '') }, [
      avatarEl(),
      h('p', { class: 'muted', style: 'margin:0', text: t('resultTitle') }),
      h('h2', { class: 'big', id: 'result-title', tabindex: '-1', 'data-focus': true, text: L(C.BANDS[res.band]) + ' — ' + res.percent + '%' }),
      h('div', { class: 'gold-line', 'aria-hidden': 'true' })
    ]);
    scr.appendChild(head);
    scr.appendChild(h('p', { style: 'text-align:center' }, [put(h('span'), c.title)]));

    /* البطاقة 1: الأداء */
    var stageList = h('ul', { class: 'stage-list' }, c.stages.map(function (st, i) {
      var p = r.picks[i];
      return h('li', null, [h('span', { text: L(C.STAGES[st.type]) }), h('span', { class: 'r-' + p.points, text: L(C.RATINGS[p.points]) + ' · ' + p.points + '/3' })]);
    }));
    var pctNum = h('span', { text: animate && !reduced() ? '0' : String(res.percent) });
    var pctEl = h('div', { class: 'pct' }, [pctNum, '%']);
    var perf = h('section', { class: 'rcard', 'aria-labelledby': 'perf-h' }, [
      h('h3', { id: 'perf-h', text: t('perfTitle') }),
      pctEl,
      h('p', { text: t('scoreLine', { total: res.total, max: res.max }) + ' · ' + L(C.BANDS[res.band]) }),
      h('p', { class: 'won-line ' + (res.won ? 'r-3' : 'muted'), text: res.won ? t('wonLine') : t('notWonLine') }),
      h('p', { class: 'muted', text: r.rec.isBest ? (r.rec.prevBest !== null ? t('newBest') : '') : t('keptBest', { best: r.rec.prevBest }) }),
      stageList
    ]);
    /* البطاقة 2: وش صار فعلًا */
    var outcome = Lg.realOutcome(v.winner, r.side);
    var winnerLine = v.winner === 'mixed' ? h('p', { class: 'won-line', text: t('realMixed') })
      : h('p', { class: 'won-line' }, [t('realWinner', { name: '' }), put(h('span'), c.parties[v.winner].name)]);
    /* الرقم داخل bdi باتجاه LTR عشان «3-2» ما ينقلب «2-3» في العربي */
    var voteLine = v.vote ? h('p', null, [t('vote', { vote: '' }), h('bdi', { dir: 'ltr', text: v.vote }), v.voteStatus === 'likely' ? ' ' + t('voteLikely') : null]) : null;
    var real = h('section', { class: 'rcard', 'aria-labelledby': 'real-h' }, [
      h('h3', { id: 'real-h', text: t('realTitle') }),
      winnerLine,
      h('p', { loc: v.summary }),
      voteLine,
      h('h4', { text: t('whyRuled') }),
      h('p', { loc: v.reasoning }),
      h('h4', { text: t('aftermath') }),
      h('p', { loc: v.aftermath }),
      h('h4', { text: t('sources') }),
      sourceList(c)
    ]);
    scr.appendChild(h('div', { class: 'result-cards' }, [perf, real]));

    /* رسالة الربط */
    var clientName = L(c.parties[r.side].name);
    if (outcome === 'lost') scr.appendChild(h('div', { class: 'bridge', role: 'note', text: res.won ? t('bridgeStrong', { name: clientName }) : t('bridgeWeak', { name: clientName }) }));
    else if (outcome === 'mixed') scr.appendChild(h('div', { class: 'bridge', role: 'note', text: t('bridgeMixed', { name: clientName }) }));

    if (r.newTitle) scr.appendChild(h('div', { class: 'new-title', role: 'status' }, [h('span', { text: t('newTitle') }), h('strong', { text: L(r.newTitle.title) })]));
    if (r.newTitle) C.RANKS.forEach(function (rk) {
      /* الأوسمة اللي انفتحت بهالقضية: حدّها بين المكسوب قبل وبعد */
      var need = rankNeed(rk);
      if (r.winsBefore < need && r.winsAfter >= need) scr.appendChild(h('div', { class: 'royal-open', role: 'status' }, [icon(rk.id), h('span', { text: t('rankOpened', { name: rankName(rk) }) })]));
    });
    var sb = signedBlock(animate && !reduced());
    if (sb) scr.appendChild(sb);

    scr.appendChild(h('div', { class: 'btn-row' }, [
      h('button', { class: 'btn btn-primary', type: 'button', text: t('anotherCase'), onclick: function () { show('browse'); } }),
      h('button', { class: 'btn btn-ghost', type: 'button', text: t('replay'), onclick: function () { startTrial(c, r.side); } }),
      h('button', { class: 'btn btn-ghost', type: 'button', text: t('otherSide'), onclick: function () { startTrial(c, other); } })
    ]));
    if (animate && !reduced()) {
      restart($('scr-result'), 'shake');
      setTimeout(function () { countTo(pctNum, 0, res.percent); }, 300);
    }
  };

  /* =================== [7] الملف الشخصي =================== */
  var confirmOpen = false;
  renderers.profile = function (fresh) {
    if (fresh) confirmOpen = false;
    var scr = $('scr-profile');
    scr.textContent = '';
    var wins = winsNow();
    var ti = currentTitle();
    var pct = ti.nextAt === null ? 100 : Math.round((wins - ti.from) / (ti.nextAt - ti.from) * 100);
    var bar = h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct) }, [h('i', { style: 'width:' + pct + '%' })]);
    var whyCard = null;
    C.WHY.forEach(function (w) { if (w.key === state.whyKey) whyCard = w; });
    var doneIds = Object.keys(state.completed);
    var doneList = doneIds.length ? h('ul', { class: 'done-list' }, doneIds.map(function (id) {
      var e = state.completed[id], c = caseById(id);
      var name = c ? L(c.title) : id;
      var sideName = c ? L(c.parties[e.side].name) : e.side;
      return h('li', null, [
        h('span', { text: (e.best >= C.SCORING.winPercent ? '✓ ' : '') + name }),
        h('span', { class: 'muted', text: t('bestFor', { best: e.best, side: sideName }) + (e.date ? ' · ' + e.date : '') })
      ]);
    })) : h('p', { class: 'muted', text: t('noFinished') });

    [
      h('h2', { class: 'h2', id: 'profile-title', tabindex: '-1', 'data-focus': true, text: t('profileTitle') }),
      h('div', { class: 'profile-head' }, [avatarEl(64), h('p', { class: 'player-name', style: 'font-size:1.25rem;font-weight:600;margin:0', text: state.name })]),
      h('div', { class: 'title-frame' }, [h('span', { class: 'muted', text: t('yourTitle') }), h('strong', { text: L(ti.title) })]),
      h('p', { style: 'margin:0', text: t('winsCount', { wins: count(wins, 'casesWon') }) }),
      bar,
      h('p', { class: 'muted', style: 'margin-top:0', text: ti.next ? t('toNextTitle', { count: count(ti.toNext, 'cases'), title: L(ti.next) }) : t('topTitle') }),
      (function () {
        var nr = nextRank();
        return h('p', { class: 'next-medal' }, nr
          ? [icon(nr.id, 'locked-mini'), h('span', { text: t('rankNext', { name: rankName(nr), count: count(Math.max(0, rankNeed(nr) - wins), 'cases') }) })]
          : [h('span', { text: t('rankAll') })]);
      })(),
      h('div', { class: 'panel' }, [
        h('h3', { text: t('yourWhy') }),
        whyCard ? h('p', null, [h('strong', { text: L(whyCard.label) }), ' — ' + L(whyCard.desc)]) : null,
        state.why ? h('p', { class: 'player-text', text: state.why }) : null,
        !whyCard && !state.why ? h('p', { class: 'muted', text: t('noWhy') }) : null
      ]),
      h('div', { class: 'panel' }, [h('h3', { text: t('finishedCases') }), doneList]),
      h('div', { class: 'panel' }, [avatarPicker()]),
      h('div', { class: 'panel' }, [signaturePad()]),
      h('div', { class: 'btn-row' }, [
        h('button', { class: 'btn btn-primary', type: 'button', text: t('backToCasesBtn'), onclick: function () { show('browse'); } }),
        h('button', { class: 'btn btn-ghost', type: 'button', text: t('changeName'), onclick: function () { show('welcome'); } }),
        h('button', { class: 'btn btn-danger', type: 'button', id: 'clearBtn', 'aria-expanded': String(confirmOpen), text: t('clearData'),
          onclick: function () { confirmOpen = true; renderers.profile(false); $('clearYes').focus(); } })
      ]),
      confirmOpen ? h('div', { class: 'confirm-box', role: 'alertdialog', 'aria-labelledby': 'clearQ' }, [
        h('p', { id: 'clearQ', text: t('clearConfirm') }),
        h('div', { class: 'btn-row' }, [
          h('button', { class: 'btn btn-danger', type: 'button', id: 'clearYes', text: t('clearYes'), onclick: eraseAll }),
          h('button', { class: 'btn btn-ghost', type: 'button', text: t('cancel'), onclick: function () { confirmOpen = false; renderers.profile(false); $('clearBtn').focus(); } })
        ])
      ]) : null,
      h('p', { class: 'muted', style: 'font-size:.875rem', text: t('storageNote') })
    ].forEach(function (n) { if (n) scr.appendChild(n); });
  };

  function eraseAll() {
    try { if (store) { store.removeItem(C.STORAGE_KEY); store.removeItem(C.THEME_KEY); store.removeItem(C.AVATAR_KEY); store.removeItem(C.SIGN_KEY); } } catch (e) {}
    photoData = null; signData = null;
    var lang = state.lang;
    state = Lg.defaultState();
    state.lang = lang;
    root.removeAttribute('data-theme'); syncThemeBtn();
    filters = { region: [], tag: [], decade: [] };
    trial = null; lastResult = null; selectedCase = null;
    nameInput.value = ''; whyText.value = '';
    activeNotices = activeNotices.filter(function (k) { return k === 'noticeNoStorage'; });
    activeNotices.push('cleared');
    applyStatic();
    show('welcome');
  }

  /* ---------- خلفية بعمق (parallax) ---------- */
  if (!reduced()) {
    var l1 = document.querySelector('.l1'), l2 = document.querySelector('.l2'), l3 = document.querySelector('.l3');
    var px = 0, py = 0, pending = false;
    var paint = function () {
      pending = false;
      var sy = window.scrollY || 0;
      l1.style.transform = 'translate3d(' + (px * -18).toFixed(1) + 'px,' + (py * -14 - sy * 0.08).toFixed(1) + 'px,0)';
      l2.style.transform = 'translate3d(' + (px * -10).toFixed(1) + 'px,' + (py * -8 - sy * 0.04).toFixed(1) + 'px,0)';
      l3.style.transform = 'translate3d(' + (px * -5).toFixed(1) + 'px,' + (-((sy * 0.15) % 46)).toFixed(1) + 'px,0)';
    };
    var schedule = function () { if (!pending) { pending = true; requestAnimationFrame(paint); } };
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('pointermove', function (e) {
      if (!mqFine.matches) return;
      px = e.clientX / window.innerWidth * 2 - 1;
      py = e.clientY / window.innerHeight * 2 - 1;
      schedule();
    }, { passive: true });
  }

  /* ---------- البداية ---------- */
  syncThemeBtn();
  applyStatic();
  /* اللاعب الراجع يبدأ من القضايا مباشرة */
  show(state.name ? (state.whyKey || state.why ? 'browse' : 'why') : 'welcome', { focus: false });
})();
</script>
</body>
</html>
