<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="ديما بنت ماجد المعارك — Deema Majid AlMaarik">
<title>البشت</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E0A0E'/%3E%3Cg fill='none' stroke='%23C9A961' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M32 10V52M22 54H42M10 18H54M10 18L5 34M10 18L15 34M54 18L49 34M54 18L59 34M4 34H16Q10 42 4 34ZM48 34H60Q54 42 48 34Z'/%3E%3C/g%3E%3C/svg%3E">
<script>
  /* يُطبَّق قبل رسم الصفحة لمنع وميض الثيم أو الاتجاه الخطأ */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    try { if (localStorage.getItem('albisht-theme') === 'gold') d.setAttribute('data-theme', 'gold'); } catch (e) {}
    try {
      var s = JSON.parse(localStorage.getItem('albisht.v1') || 'null');
      if (s && s.lang === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= الثيم الخمري (الافتراضي) ================= */
  :root {
    --bg: #1E0A0E; --surface: #2E1015; --surface-2: #3D161D; --wine: #6B1E2A;
    --gold: #C9A961; --gold-hover: #D4B774; --gold-line: #8C7340;
    --text: #F3EBDD; --text-muted: #C9B9A6; --on-gold: #1E0A0E;
    --good: #9CC9A3; --weak: #E8A0A0;
    --frame: rgba(201,169,97,.18); --shadow: rgba(0,0,0,.35); --shine: rgba(232,205,140,.22);
    --dust: #E9CF8E; --dust-glow: rgba(201,169,97,.6);
    --font-head: "Amiri", "Traditional Arabic", "Sakkal Majalla", "Times New Roman", serif;
    --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Geeza Pro", sans-serif;
    --radius: 10px; --tap: 44px; --ease-out: cubic-bezier(.2,.8,.2,1);
  }
  /* ================= الثيم الذهبي (زر «قلب الألوان») ================= */
  html[data-theme="gold"] {
    --bg: #F3E3B8; --surface: #FBF1D6; --surface-2: #EFD9A0; --wine: #E2C084;
    --gold: #7A1F2E; --gold-hover: #8E2536; --gold-line: #9C7438;
    --text: #4A0F1A; --text-muted: #6E2A35; --on-gold: #FBF1D6;
    --good: #2E6B3A; --weak: #9E1B1B;
    --frame: rgba(122,31,46,.16); --shadow: rgba(74,15,26,.18); --shine: rgba(255,255,255,.55);
    --dust: #FFFBEF; --dust-glow: rgba(156,116,56,.55);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--surface) 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.8;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.4; margin: 0; }
  a { color: var(--gold); }
  p { margin: .5rem 0; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .muted { color: var(--text-muted); }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  html.theme-anim body, html.theme-anim body *, html.theme-anim body *::before, html.theme-anim body *::after {
    transition: background-color 450ms ease, color 450ms ease, border-color 450ms ease, fill 450ms ease, stroke 450ms ease !important;
  }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 480ms; }

  /* ================= خلفية بعمق ================= */
  /* الحاوية بحجم الشاشة بالضبط (لو أكبر، الجوال يوسّع عرض الصفحة)، والطبقات داخلها أكبر للحركة */
  .depth { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .layer { position: absolute; inset: -40px; will-change: transform; }
  .layer svg { position: absolute; color: var(--gold); }
  .l1 svg { width: 52vmin; height: 52vmin; top: 8vh; inset-inline-end: -8vmin; opacity: .07; }
  .l2 .orb { position: absolute; border: 1px solid var(--gold-line); border-radius: 50%; opacity: .28; }
  .l2 .orb:nth-child(1) { width: 70vmin; height: 70vmin; bottom: -20vmin; inset-inline-start: -22vmin; }
  .l2 .orb:nth-child(2) { width: 40vmin; height: 40vmin; bottom: -6vmin; inset-inline-start: -7vmin; }
  .l3 { inset: -60px; background-image: radial-gradient(var(--gold-line) 1px, transparent 1.6px); background-size: 46px 46px; opacity: .22; }
  .appbar, .disclaimer, .notice, .app, .site-foot { position: relative; z-index: 1; }

  /* ================= الشريط العلوي الثابت ================= */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    padding: .5rem max(.75rem, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border-bottom: 1px solid var(--gold-line);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) { .appbar { background: var(--bg); } }
  .appbar .brand { font-family: var(--font-head); color: var(--gold); font-size: 1.35rem; font-weight: 700; }
  .appbar .start, .appbar .end { display: flex; align-items: center; gap: .5rem; }
  .icon-btn[hidden], .btn[hidden] { display: none; }
  html[dir="rtl"] .back-btn svg { transform: scaleX(-1); }   /* السهم يؤشر لبداية السطر في اللغتين */
  .icon-btn {
    min-width: var(--tap); min-height: var(--tap);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--gold); border: 1px solid var(--gold-line); border-radius: 50%;
    cursor: pointer; font: inherit;
  }
  .icon-btn:hover { border-color: var(--gold); }
  .pill-btn {
    min-height: var(--tap); padding: 0 .9rem; display: inline-flex; align-items: center; gap: .45rem;
    background: transparent; color: var(--text-muted); border: 1px solid var(--gold-line); border-radius: 999px;
    font: inherit; font-size: .9375rem; cursor: pointer; transition: border-color 150ms ease, transform 150ms ease;
  }
  .pill-btn:hover { border-color: var(--gold); }
  .pill-btn:active { transform: scale(.96); }
  .theme-btn .coin { width: 20px; height: 20px; color: var(--gold); transition: transform 600ms var(--ease-out); }
  html[data-theme="gold"] .theme-btn .coin { transform: perspective(80px) rotateY(180deg); }
  .appbar .brand { white-space: nowrap; }
  @media (max-width: 360px) {
    .appbar, .appbar .start, .appbar .end { gap: .3rem; }
    .appbar { padding-inline: .5rem; }
    .appbar .brand { font-size: 1.15rem; }
    .pill-btn { padding: 0 .65rem; }
  }
  @media (max-width: 600px) { .theme-btn .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

  .disclaimer { text-align: center; font-size: .875rem; color: var(--text-muted); padding: .35rem 1rem; border-bottom: 1px dashed var(--gold-line); }
  .notice {
    max-width: 760px; margin: .75rem auto 0; padding: .6rem 1rem;
    display: flex; gap: .75rem; align-items: center; justify-content: space-between;
    background: var(--surface-2); border: 1px solid var(--gold); border-radius: var(--radius); font-size: .9375rem;
  }

  /* ================= الشاشات ================= */
  /* clip: حركة دخول الشاشة ثلاثية الأبعاد توسّع حافتها السفلية لحظيًا، وكروم الجوال كان يوسّع الصفحة كلها على أعرض شي شافه */
  .app { padding: 1rem; max-width: 1180px; margin: 0 auto; overflow-x: clip; }
  .screen {
    background: var(--bg); border: 1px solid var(--gold-line); border-radius: 18px;
    padding: 1.25rem; position: relative; box-shadow: 0 18px 40px var(--shadow);
    max-width: 760px; margin: 0 auto;
  }
  .screen.wide { max-width: 1180px; }
  .screen::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--frame); border-radius: 13px; pointer-events: none; }
  .screen.enter { animation: screenIn 800ms var(--ease-out) both; transform-origin: 50% 0; }
  .screen.shake { animation: shake 320ms ease-out; }
  @media (min-width: 720px) { .screen { padding: 1.75rem 2rem; } }

  .ornament { display: flex; align-items: center; gap: .75rem; margin: 1rem auto; max-width: 16rem; }
  .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }
  .ornament span { width: 8px; height: 8px; transform: rotate(45deg); border: 1px solid var(--gold); flex: none; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
  .section-title h2, .h2 { font-size: clamp(1.6rem, 4vw, 2rem); color: var(--gold); }
  .count { color: var(--text-muted); font-size: .9375rem; }
  .greet { color: var(--text-muted); margin: 0 0 .5rem; }
  /* نصوص يكتبها اللاعب (اسم طويل بدون مسافات) ما تطلع برا إطارها */
  .greet, .player-name, .player-text, .title-frame, .done-list, .notice > span, .trial-top .who, .form-error { overflow-wrap: anywhere; min-width: 0; }
  .notice .btn { flex: none; }

  /* ================= الأزرار ================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    min-height: 48px; padding: .5rem 1.25rem; border-radius: var(--radius);
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn-primary { background: var(--gold); color: var(--on-gold); border: 1px solid var(--gold); box-shadow: 0 6px 16px var(--shadow); }
  .btn-primary:hover { background: var(--gold-hover); }
  .btn-block { width: 100%; }
  .btn-ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold-line); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--gold); }
  .btn-danger { background: transparent; color: var(--weak); border: 1px solid var(--weak); }
  .btn-small { min-height: var(--tap); padding: .25rem .9rem; font-size: .9375rem; }
  .btn svg { width: 18px; height: 18px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  .back-link { margin-block-end: .75rem; }

  /* ================= الترحيب ================= */
  .welcome { text-align: center; overflow: hidden; }
  .welcome > *:not(.dust) { position: relative; z-index: 1; }
  .scales { width: 92px; height: 92px; color: var(--gold); display: block; margin: .25rem auto 0; cursor: pointer; }
  .scales .beam { transform-origin: 32px 16px; }
  .welcome.swing .beam  { animation: beam 2.4s ease-in-out 2; }
  .welcome.swing .pan-l { animation: panL 2.4s ease-in-out 2; }
  .welcome.swing .pan-r { animation: panR 2.4s ease-in-out 2; }
  .welcome h1 { font-size: clamp(2.25rem, 7vw, 3rem); color: var(--gold); transform-origin: 50% 100%; animation: titleIn 900ms var(--ease-out) 150ms both; }
  .tagline { color: var(--text-muted); margin: .25rem 0 1.25rem; animation: fadeUp 600ms ease-out 550ms both; }
  .welcome .ornament::before, .welcome .ornament::after { animation: draw 700ms var(--ease-out) 350ms both; }
  .welcome .ornament span { animation: spinIn 700ms var(--ease-out) 300ms both; }
  .welcome form { max-width: 460px; margin: 0 auto; }
  .dust { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 900ms ease; z-index: 0; }
  .welcome.alive .dust { opacity: 1; }
  .dust i {
    position: absolute; bottom: -12px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
    background: var(--dust); box-shadow: 0 0 6px 1px var(--dust-glow); opacity: 0;
    animation: float var(--d) linear var(--delay) infinite;
  }
  .welcome:not(.alive) .dust i { animation-play-state: paused; }

  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .address { text-align: start; margin-block-end: 1rem; }
  .address legend { font-weight: 600; padding: 0; margin-block-end: .4rem; }
  .address legend small { color: var(--text-muted); font-weight: 400; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .seg input, .why-cards input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg label {
    min-height: 48px; display: flex; align-items: center; justify-content: center;
    background: var(--surface); color: var(--text); border: 1px solid var(--gold-line); border-radius: var(--radius);
    font-weight: 600; cursor: pointer; transition: background-color 150ms ease, transform 150ms ease, border-color 150ms ease;
  }
  .seg label:hover { border-color: var(--gold); }
  .seg label:active { transform: scale(.97); }
  .seg input:checked + label { background: var(--gold); color: var(--on-gold); border-color: var(--gold); animation: pop 320ms var(--ease-out); }
  .seg input:focus-visible + label { outline: 3px solid var(--gold); outline-offset: 3px; }
  .field { text-align: start; margin-block-end: 1rem; }
  .field label { display: block; font-weight: 600; margin-block-end: .4rem; }
  .field input, .field textarea {
    width: 100%; min-height: 52px; padding: .5rem 1rem; background: var(--surface); color: var(--text);
    border: 1px solid var(--gold-line); border-radius: var(--radius); font: inherit;
  }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-muted); opacity: 1; }
  .field input:focus-visible, .field textarea:focus-visible { border-color: var(--gold); }
  .field .hint { font-size: .8125rem; color: var(--text-muted); }
  .form-error { color: var(--weak); font-weight: 600; min-height: 1.5em; margin: .25rem 0; text-align: start; }
  .privacy { display: flex; gap: .5rem; align-items: flex-start; text-align: start; color: var(--text-muted); font-size: .9375rem; margin: 1rem auto 0; max-width: 460px; }
  .privacy svg { flex: none; width: 20px; height: 20px; margin-top: .3rem; color: var(--gold); }

  /* ================= لماذا يختارك أحد؟ ================= */
  /* ================= الأفاتار ================= */
  .avatar { display: inline-grid; place-items: center; flex: none; width: var(--av, 40px); height: var(--av, 40px); border-radius: 50%; overflow: hidden; background: var(--surface-2); color: var(--gold); border: 1px solid var(--gold); }
  .avatar img, .avatar svg { display: block; width: 100%; height: 100%; }
  .avatar img { object-fit: cover; }
  #profileBtn.has-avatar { padding: 0; overflow: hidden; border-color: var(--gold); }
  #profileBtn.has-avatar .avatar { --av: 100%; border: 0; width: 42px; height: 42px; }
  .avatar-pick { text-align: start; margin: 0 0 1rem; padding: 0; border: 0; min-width: 0; }
  .avatar-pick legend { font-weight: 600; padding: 0; margin-block-end: .5rem; }
  .avatar-pick legend small { color: var(--text-muted); font-weight: 400; }
  /* أربعة في كل صف (4 + 4 + 2)، والمساحة الباقية على جنب فاضية */
  .av-grid { display: grid; grid-template-columns: repeat(4, minmax(52px, 64px)); justify-content: start; gap: .6rem; }
  .av-grid input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .av-grid label { display: grid; place-items: center; aspect-ratio: 1; min-width: var(--tap); border-radius: 50%; overflow: hidden; border: 1px solid var(--gold-line); background: var(--surface); color: var(--gold); cursor: pointer; transition: border-color 150ms ease, transform 150ms ease, background-color 150ms ease; }
  .av-grid label svg, .av-grid label img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .av-grid label:hover { border-color: var(--gold); transform: translateY(-2px); }
  .av-grid input:checked + label { border: 2px solid var(--gold); background: var(--surface-2); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--gold); animation: pop 320ms var(--ease-out); }
  .av-grid input:focus-visible + label { outline: 3px solid var(--gold); outline-offset: 5px; }
  /* الختم الشخصي والوسام المقفل */
  .av-grid label.seal-tile { position: relative; overflow: visible; background: transparent; border-color: transparent; }
  .av-grid label.seal-tile svg { filter: drop-shadow(0 3px 4px rgb(0 0 0 / .45)); }
  .new-tag { position: absolute; top: -6px; inset-inline-start: -6px; background: #B3122E; color: #fff; font-size: .65rem; font-weight: 700; line-height: 1; padding: .25rem .4rem; border-radius: 999px; box-shadow: 0 2px 6px var(--shadow); pointer-events: none; }
  .seal-svg.stamp { animation: sealStamp 650ms cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes sealStamp { 0% { transform: scale(1.7) rotate(-14deg); opacity: 0; } 60% { transform: scale(.94) rotate(2deg); opacity: 1; } 100% { transform: none; } }
  .av-locked { position: relative; aspect-ratio: 1; min-width: var(--tap); padding: 0; border-radius: 50%; border: 1px solid var(--gold-line); background: var(--surface); cursor: pointer; overflow: hidden; }
  .av-locked > svg { display: block; width: 100%; height: 100%; filter: grayscale(1) brightness(.5) contrast(.9); }
  .av-locked .lock-badge { position: absolute; inset: 0; display: grid; place-items: center; }
  .av-locked .lock-badge svg { width: 26px; height: 26px; padding: 5px; border-radius: 50%; color: #3A0F18; background: linear-gradient(145deg, #F6E1A3, #9A7430); box-shadow: 0 2px 8px rgb(0 0 0 / .5); }
  .av-locked:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
  .wax-row { margin-top: .75rem; }
  .wax-legend { margin: 0 0 .4rem; font-weight: 600; font-size: .9375rem; }
  .wax { display: flex; flex-wrap: wrap; gap: .45rem; }
  .wax .sw { width: var(--tap); height: var(--tap); padding: 0; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font: inherit; box-shadow: inset 0 -4px 8px rgb(0 0 0 / .35), 0 2px 6px var(--shadow); }
  .wax .sw[aria-checked="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--gold); }
  .wax .sw:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
  .wax .sw.auto { background: conic-gradient(#B3122E, #8E1B3A, #A3341F, #6E1F4F, #B3122E); color: #FFF1C4; font-size: .65rem; font-weight: 700; }
  .royal-open { display: flex; align-items: center; gap: .75rem; margin: 1rem auto 0; max-width: 520px; padding: .75rem 1rem; border: 1px solid var(--gold); border-radius: var(--radius); background: var(--surface-2); }
  .royal-open svg { flex: none; width: 56px; height: 56px; }
  .next-medal { display: flex; align-items: center; gap: .6rem; margin: .25rem 0 1rem; color: var(--text-muted); }
  .next-medal svg { flex: none; width: 40px; height: 40px; }
  .next-medal svg.locked-mini { filter: grayscale(1) brightness(.6); }
  @media (prefers-reduced-motion: reduce) { .seal-svg.stamp { animation: none; } }
  .avatar-pick .form-error:empty { min-height: 0; margin: 0; }
  .av-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .av-note { display: flex; gap: .4rem; align-items: flex-start; color: var(--text-muted); font-size: .875rem; margin: .5rem 0 0; }
  .av-note svg { flex: none; width: 16px; height: 16px; margin-top: .25rem; color: var(--gold); }
  /* ================= التوقيع ================= */
  .identity { text-align: start; }
  @media (min-width: 720px) {
    .welcome form { max-width: 660px; }
    .identity { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  }
  .sign-pick { text-align: start; margin: 0 0 1rem; padding: 0; border: 0; min-width: 0; }
  .sign-pick legend { font-weight: 600; padding: 0; margin-block-end: .5rem; }
  .sign-pick legend small { color: var(--text-muted); font-weight: 400; }
  /* الورقة بألوان ثابتة (ورق قديم وحبر غامق) عشان التوقيع يبان في الثيمين */
  .paper { position: relative; border-radius: 10px; border: 1px solid #B8955A; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #FBF3DF 0%, #F1E2BE 70%, #E6D2A4 100%);
    box-shadow: inset 0 0 18px rgb(120 80 30 / .25), 0 4px 14px var(--shadow); }
  .paper::after { content: ""; position: absolute; inset-inline: 8%; bottom: 24%; border-bottom: 1px dashed #A8824A; pointer-events: none; }
  .sign-pad canvas { display: block; width: 100%; aspect-ratio: 32 / 15; touch-action: none; cursor: crosshair; position: relative; z-index: 1; }
  .sign-pad canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .sign-ph { position: absolute; inset: 0; display: grid; place-items: center; color: #8E6E44; font-size: .9375rem; pointer-events: none; transition: opacity 200ms ease; }
  .sign-pad.has-ink .sign-ph { opacity: 0; }
  .signed { margin: 1.25rem auto 0; max-width: 360px; text-align: center; }
  .signed .paper { padding: .4rem 1rem; }
  .signed .paper::after { bottom: 18%; }
  .signed img { display: block; width: 100%; height: auto; max-height: 120px; object-fit: contain; position: relative; z-index: 1; }
  .signed .who { margin: 0 0 .4rem; color: var(--text-muted); font-size: .9375rem; }
  .signed .who strong { color: var(--text); }
  .signed.stamp .paper { animation: signIn 700ms var(--ease-out) 300ms both; }
  @keyframes signIn { from { opacity: 0; transform: translateY(10px) rotate(-2deg) scale(.96); } to { opacity: 1; transform: none; } }
  .profile-head { display: flex; align-items: center; gap: .9rem; margin-top: .5rem; }
  .result-head .avatar { --av: 64px; margin-block-end: .5rem; }
  .cropper { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .72); }
  .crop-box { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius); padding: 1rem; text-align: center; box-shadow: 0 20px 50px var(--shadow); }
  .crop-box h3 { margin: 0; font-family: var(--font-head); color: var(--gold); }
  .crop-view { width: min(66vw, 240px); aspect-ratio: 1; margin: .9rem auto; border-radius: 50%; overflow: hidden; border: 2px solid var(--gold); touch-action: none; cursor: grab; background: var(--bg); }
  .crop-view:active { cursor: grabbing; }
  .crop-view:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .crop-view canvas { display: block; width: 100%; height: 100%; }
  .crop-zoom { display: flex; align-items: center; gap: .6rem; margin: 0 0 .9rem; }
  .crop-zoom input { flex: 1; accent-color: var(--gold); min-height: var(--tap); }
  .why-cards { display: grid; gap: .75rem; margin: 1rem 0; }
  @media (min-width: 620px) { .why-cards { grid-template-columns: 1fr 1fr; } }
  .why-card {
    display: block; padding: 1rem; min-height: 96px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--radius);
    transition: border-color 150ms ease, transform 150ms ease, background-color 150ms ease;
    animation: optIn 520ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 110ms);
  }
  .why-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .why-card strong { display: block; font-family: var(--font-head); font-size: 1.2rem; color: var(--gold); }
  .why-card span { color: var(--text-muted); font-size: .9375rem; }
  .why-cards input:checked + .why-card { background: var(--surface-2); border: 2px solid var(--gold); }
  .why-cards input:checked + .why-card strong::after { content: " ✓"; }
  .why-cards input:focus-visible + .why-card { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ================= تصفح القضايا ================= */
  .filter-group { margin-top: .75rem; }
  .filter-group legend { font-size: .875rem; color: var(--text-muted); font-weight: 500; margin-block-end: .35rem; padding: 0; }
  .chips { display: flex; gap: .5rem; overflow-x: auto; min-width: 0; max-width: 100%; padding-block-end: .35rem; scrollbar-width: thin; }
  .chip {
    flex: none; min-height: var(--tap); padding: 0 1rem; background: var(--surface); color: var(--text);
    border: 1px solid var(--gold-line); border-radius: 999px; font: inherit; font-size: .9375rem; cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
  }
  .chip:hover { border-color: var(--gold); }
  .chip:active { transform: scale(.95); }
  .chip[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); font-weight: 600; }
  .filter-actions { margin-top: .5rem; min-height: var(--tap); }
  .empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); border: 1px dashed var(--gold-line); border-radius: var(--radius); margin-top: 1.25rem; }

  .cards { display: grid; gap: 1rem; margin-top: 1.25rem; }
  @media (min-width: 720px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .case { position: relative; border-radius: var(--radius); perspective: 1100px; transition: transform 450ms var(--ease-out); will-change: transform; animation: optIn 600ms var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
  .case.is-tilting { transition: transform 90ms linear; }
  /* ارتفاع الملف = محتوى الوجه الأمامي فقط؛ الظهر فوقه بنفس المقاس ويتمرر لحاله */
  .case-inner { display: grid; position: relative; height: 100%; min-height: 15rem; transform-style: preserve-3d; transition: transform 750ms cubic-bezier(.3,.7,.2,1); }
  .case.is-flipped .case-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--radius);
    padding: 1rem; position: relative; overflow: hidden; box-shadow: 0 8px 22px var(--shadow);
    display: flex; flex-direction: column;
  }
  .face.front { min-height: 15rem; }
  .face.back { transform: rotateY(180deg); position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .face.front::before { content: ""; position: absolute; inset-block: 1rem; inset-inline-start: 0; width: 3px; background: var(--gold); border-radius: 2px; }
  .face::after {
    content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%;
    background: linear-gradient(105deg, transparent 0%, var(--shine) 50%, transparent 100%);
    transform: translateX(-130%) skewX(-12deg); opacity: 0; pointer-events: none;
  }
  .case.shine .face::after { animation: sweep 950ms ease-out; }
  .badges { display: flex; flex-wrap: wrap; gap: .4rem; margin-block-end: .5rem; }
  .badge { font-size: .8125rem; line-height: 1.6; padding: .1rem .6rem; background: var(--wine); color: var(--text); border-radius: 999px; }
  .badge.year { background: transparent; border: 1px solid var(--gold-line); color: var(--gold); }
  .badge.done { background: var(--gold); color: var(--on-gold); font-weight: 600; }
  .case h3 { font-size: 1.375rem; color: var(--text); }
  .orig { display: block; font-family: var(--font-body); font-size: .875rem; color: var(--text-muted); font-weight: 400; }
  .case .lead { margin: .5rem 0 .75rem; color: var(--text-muted); font-size: 1rem; flex: 1; }
  .card-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .card-actions .btn { flex: 1 1 auto; }
  .back h4 { font-size: 1.25rem; color: var(--gold); margin-block-end: .5rem; }
  /* ظهر الملف مضغوط عشان يدخل في ارتفاع الوجه، والباقي يتمرر */
  .face.back .facts-dl { gap: .3rem; margin-block-end: .5rem; }
  .face.back .facts-dl div { padding-block-end: .25rem; }
  .face.back .facts-dl dd { line-height: 1.5; }
  .face.back > p { margin: 0 0 .5rem; font-size: .9375rem; }
  .facts-dl { margin: 0 0 .9rem; display: grid; gap: .55rem; }
  .facts-dl div { border-block-end: 1px dashed var(--gold-line); padding-block-end: .45rem; }
  .facts-dl dt { font-size: .8125rem; color: var(--text-muted); font-weight: 500; }
  .facts-dl dd { margin: 0; font-size: .9375rem; line-height: 1.7; }

  /* ================= ملف القضية ================= */
  .panel { background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: 1rem; margin-top: 1rem; }
  .panel h3 { font-size: 1.25rem; color: var(--gold); margin-block-end: .35rem; }
  .ev-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
  .ev-list li { border-inline-start: 3px solid var(--gold-line); padding-inline-start: .75rem; }
  .ev-list strong { display: block; }
  .ev-list span { color: var(--text-muted); font-size: .9375rem; }
  .sources { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
  .sources a { word-break: break-word; }
  .src-status { display: inline-block; font-size: .75rem; padding: 0 .5rem; border-radius: 999px; border: 1px solid var(--gold-line); color: var(--text-muted); margin-inline-start: .35rem; }
  .src-status.confirmed { color: var(--good); border-color: var(--good); }
  .src-status.unread { color: var(--weak); border-color: var(--weak); }
  .src-host { display: block; font-size: .8125rem; color: var(--text-muted); }
  .client-title { font-family: var(--font-head); font-size: 1.35rem; color: var(--gold); margin: 1.25rem 0 .5rem; }
  .clients { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .client {
    min-height: 64px; padding: .5rem .6rem; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--gold-line); border-radius: var(--radius); font: inherit; font-size: 1rem; line-height: 1.4; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
  }
  .client small { color: var(--text-muted); font-size: .8125rem; }
  .client:hover { border-color: var(--gold); background: var(--wine); transform: translateY(-2px); }
  .client:active { transform: scale(.97); }
  .neutral-note { font-size: .875rem; color: var(--text-muted); margin-top: .5rem; }

  /* ================= المحاكمة ================= */
  .trial-top { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; padding-block-end: .75rem; margin-block-end: 1rem; border-bottom: 1px solid var(--gold-line); }
  .trial-top .who { display: flex; flex-direction: column; line-height: 1.4; }
  .trial-top .who strong { font-weight: 600; }
  .trial-top .who small { color: var(--gold); font-size: .875rem; }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: .15rem; }
  .progress { display: flex; align-items: center; gap: .6rem; font-size: .875rem; color: var(--text-muted); }
  .steps { display: flex; gap: 4px; }
  .steps i { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--gold-line); }
  .steps i.done { background: var(--gold); border-color: var(--gold); }
  .score { position: relative; font-size: .9375rem; color: var(--text-muted); }
  .score b { display: inline-block; color: var(--gold); font-weight: 600; min-width: 1.6em; text-align: center; }
  .score b.bump { animation: bump 450ms var(--ease-out); }
  .plus { position: absolute; inset-inline-start: 100%; top: -2px; margin-inline-start: .25rem; color: var(--good); font-weight: 600; font-size: .875rem; opacity: 0; pointer-events: none; }
  .plus.go { animation: plusUp 1000ms ease-out; }
  .bench { position: relative; display: flex; align-items: center; gap: .75rem; background: var(--wine); border-radius: var(--radius); padding: .6rem .9rem; margin-block-end: 1rem; }
  .bench > svg { width: 36px; height: 36px; color: var(--gold); flex: none; }
  .bench strong { display: block; font-family: var(--font-head); font-size: 1.125rem; color: var(--gold); line-height: 1.3; }
  .bench span.sub { font-size: .875rem; color: var(--text); }
  .gavel-wrap { position: relative; margin-inline-start: auto; width: 48px; height: 48px; flex: none; }
  .gavel { width: 48px; height: 48px; color: var(--gold); display: block; }
  .gavel-arm { transform-origin: 42px 40px; }
  .strike .gavel-arm { animation: gavel 560ms cubic-bezier(.5,0,.6,1); }
  .ring { position: absolute; left: 36%; top: 70%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid var(--gold); border-radius: 50%; opacity: 0; pointer-events: none; }
  .hit .ring { animation: ring 650ms ease-out; }
  .hit .ring.r2 { animation-delay: 110ms; }
  .stage { transform-origin: 100% 50%; }
  html[dir="ltr"] .stage { transform-origin: 0 50%; }
  .stage.turn-out { animation: turnOut 360ms ease-in both; }
  .stage.turn-in { animation: turnIn 480ms var(--ease-out) backwards; }
  .stage-name { font-family: var(--font-head); font-size: 1.35rem; color: var(--gold); margin: 0; }
  .question { background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: .9rem 1rem; margin: .5rem 0 1rem; }
  .question .opp { margin: 0 0 .5rem; }
  .question .opp q { quotes: "«" "»"; }
  html[lang="en"] .question .opp q { quotes: "“" "”"; }
  .question .ask { margin: 0; font-weight: 600; }
  .evidence-title { font-size: .875rem; color: var(--text-muted); font-weight: 500; margin: 0 0 .35rem; }
  .evidence { display: flex; flex-wrap: wrap; gap: .5rem; margin-block-end: .5rem; }
  .ev {
    min-height: var(--tap); padding: 0 .9rem; display: inline-flex; align-items: center; gap: .4rem;
    background: transparent; color: var(--text); border: 1px dashed var(--gold-line); border-radius: var(--radius);
    font: inherit; font-size: .9375rem; cursor: pointer;
  }
  .ev[aria-expanded="true"] { border-style: solid; border-color: var(--gold); background: var(--surface); }
  .ev svg { width: 18px; height: 18px; color: var(--gold); }
  .ev-detail { font-size: .9375rem; color: var(--text-muted); background: var(--surface); border-radius: var(--radius); padding: .5rem .8rem; margin: 0 0 1rem; }
  .options { display: grid; gap: .6rem; margin-top: .75rem; }
  .options.enter .option { animation: optIn 520ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 120ms); }
  .option {
    display: flex; gap: .75rem; align-items: flex-start; min-height: 56px; padding: .75rem .9rem;
    background: var(--surface); color: var(--text); border: 1px solid var(--gold-line); border-radius: var(--radius);
    font: inherit; font-size: 1rem; line-height: 1.7; text-align: start; width: 100%; cursor: pointer;
    transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
  }
  .option:hover:not([aria-disabled="true"]) { border-color: var(--gold); background: var(--surface-2); transform: translateY(-2px); }
  .option:active:not([aria-disabled="true"]) { transform: scale(.98); }
  .option .letter {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--gold); color: var(--gold); font-family: var(--font-head); font-weight: 700; margin-top: .1rem;
  }
  .option[aria-checked="true"] { background: var(--surface-2); border: 2px solid var(--gold); }
  .option[aria-checked="true"] .letter { background: var(--gold); color: var(--on-gold); }
  .option[aria-disabled="true"] { cursor: default; }
  .option[aria-disabled="true"]:not([aria-checked="true"]) .opt-text { color: var(--text-muted); }
  .verdict { margin-top: 1rem; background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius); padding: .9rem 1rem; transform-origin: 50% 0; }
  .verdict.anim { animation: verdictIn 480ms var(--ease-out) both; }
  .verdict-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
  .verdict-head strong { font-family: var(--font-head); font-size: 1.125rem; color: var(--gold); }
  .rating { display: inline-flex; align-items: center; gap: .3rem; }
  .rating svg { width: 24px; height: 24px; color: var(--gold); }
  .verdict.anim .rating svg { animation: pop 420ms cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * 130ms + 150ms); }
  .rating svg.empty { color: var(--text-muted); }
  .rating .word { font-weight: 600; font-size: .9375rem; margin-inline-start: .25rem; }
  .r-3 { color: var(--good); } .r-2 { color: var(--gold); } .r-1, .r-0 { color: var(--weak); }
  .verdict .used-ev { font-size: .875rem; color: var(--text-muted); }
  .verdict .next { margin-top: .9rem; }

  /* ================= النتيجة ================= */
  .result-head { text-align: center; }
  .result-head .big { font-family: var(--font-head); font-size: clamp(2.2rem, 7vw, 3rem); color: var(--gold); line-height: 1.3; }
  .gold-line { height: 2px; background: var(--gold); width: 10rem; margin: .5rem auto 0; transform-origin: 50% 50%; }
  .result-head.anim .gold-line { animation: draw 800ms var(--ease-out) 300ms both; }
  .result-head.anim .big { animation: titleIn 800ms var(--ease-out) both; }
  .result-cards { display: grid; gap: 1rem; margin-top: 1.25rem; }
  @media (min-width: 820px) { .result-cards { grid-template-columns: 1fr 1fr; align-items: start; } }
  .rcard { background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: 1rem; }
  .rcard h3 { font-size: 1.35rem; color: var(--gold); margin-block-end: .5rem; }
  .rcard .pct { font-family: var(--font-head); font-size: 2.25rem; color: var(--text); }
  .stage-list { list-style: none; padding: 0; margin: .5rem 0 0; display: grid; gap: .35rem; }
  .stage-list li { display: flex; justify-content: space-between; gap: .5rem; border-block-end: 1px dashed var(--gold-line); padding-block-end: .3rem; font-size: .9375rem; }
  .won-line { font-weight: 600; }
  .bridge { margin-top: 1rem; padding: .8rem 1rem; border: 1px solid var(--gold); border-radius: var(--radius); background: var(--surface-2); }
  .new-title { margin-top: 1rem; text-align: center; padding: 1rem; border: 2px solid var(--gold); border-radius: var(--radius); position: relative; overflow: hidden; }
  .new-title strong { display: block; font-family: var(--font-head); font-size: 1.6rem; color: var(--gold); }
  .new-title::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; background: linear-gradient(105deg, transparent 0%, var(--shine) 50%, transparent 100%); transform: translateX(-130%) skewX(-12deg); opacity: 0; pointer-events: none; animation: sweep 1200ms ease-out 400ms; }

  /* ================= الملف الشخصي ================= */
  .title-frame { text-align: center; padding: 1rem; border: 2px solid var(--gold); border-radius: var(--radius); margin: 1rem 0; box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--gold-line); }
  .title-frame strong { display: block; font-family: var(--font-head); font-size: 2rem; color: var(--gold); }
  .bar { height: 10px; background: var(--surface-2); border: 1px solid var(--gold-line); border-radius: 999px; overflow: hidden; margin: .4rem 0; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width 900ms var(--ease-out); }
  .done-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
  .done-list li { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; border-block-end: 1px dashed var(--gold-line); padding-block-end: .4rem; }
  .confirm-box { margin-top: .75rem; padding: .8rem 1rem; border: 1px solid var(--weak); border-radius: var(--radius); }

  /* ================= أبواب المحكمة ================= */
  .doors { position: fixed; inset: 0; z-index: 50; display: flex; direction: ltr; perspective: 1400px; }
  .door { flex: 1; position: relative; background: var(--wine); border: 1px solid var(--gold-line); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .door::before { content: ""; position: absolute; inset: 9% 14%; border: 1px solid var(--gold-line); box-shadow: inset 0 0 0 7px var(--wine), inset 0 0 0 8px var(--gold-line); }
  .door .knob { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--gold); }
  .door-l { transform-origin: 0 50%; } .door-r { transform-origin: 100% 50%; }
  .door-l .knob { right: 16px; } .door-r .knob { left: 16px; }
  .door-emblem { position: absolute; top: 50%; left: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; color: var(--gold); }
  .doors.closing .door-l { animation: closeL 480ms var(--ease-out) both; }
  .doors.closing .door-r { animation: closeR 480ms var(--ease-out) both; }
  .doors.closing .door-emblem { animation: fadeUp 400ms ease-out 200ms both; }
  .doors.opening .door-l { animation: openL 950ms cubic-bezier(.6,.05,.3,1) both; }
  .doors.opening .door-r { animation: openR 950ms cubic-bezier(.6,.05,.3,1) both; }
  .doors.opening .door-emblem { animation: fadeOut 250ms ease-in both; }

  /* ================= التذييل ================= */
  .site-foot { margin: 2rem auto 0; padding: 1rem 1rem 2rem; text-align: center; color: var(--text-muted); font-size: .9375rem; max-width: 1180px; }
  .site-foot .ornament { margin-block-end: .75rem; }

  /* ================= الحركات ================= */
  @keyframes screenIn { from { opacity: 0; transform: perspective(1200px) rotateX(10deg) translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeOut  { to { opacity: 0; } }
  @keyframes titleIn  { from { opacity: 0; transform: perspective(500px) rotateX(75deg) translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes draw     { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes spinIn   { from { transform: rotate(-135deg) scale(0); } to { transform: rotate(45deg) scale(1); } }
  @keyframes beam     { 0%,100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
  @keyframes panL     { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-2.3px); } 75% { transform: translateY(2.3px); } }
  @keyframes panR     { 0%,100% { transform: translateY(0); } 25% { transform: translateY(2.3px); } 75% { transform: translateY(-2.3px); } }
  @keyframes float    { 0% { transform: translate3d(0,0,0); opacity: 0; } 15% { opacity: .9; } 80% { opacity: .55; } 100% { transform: translate3d(var(--dx), -520px, 0); opacity: 0; } }
  @keyframes pop      { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes sweep    { 0% { transform: translateX(-130%) skewX(-12deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateX(330%) skewX(-12deg); opacity: 0; } }
  @keyframes shake    { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-3px,1px); } 40% { transform: translate(3px,-1px); } 60% { transform: translate(-2px,0); } 80% { transform: translate(2px,0); } }

  @keyframes turnIn   { from { opacity: 0; transform: perspective(900px) rotateY(70deg); } to { opacity: 1; transform: none; } }

<header class="appbar">

    <button class="icon-btn back-btn" id="backBtn" type="button" data-i18n-aria="backBtn" hidden>
      <svg width="22" height="22" aria-hidden="true"><use href="#arrow-back"/></svg>

  </div>
  <span class="brand" data-i18n="appName"></span>
  <div class="end">

<main class="app" id="app">

  <!-- ===== [1] الترحيب ===== -->
  <section class="screen welcome" id="scr-welcome" aria-labelledby="w-title" hidden>
    <div class="dust" aria-hidden="true"></div>
    <svg class="scales" id="scalesArt" viewBox="0 0 64 64" role="img" data-i18n-aria="scalesAria">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="8" r="2.5"/>
        <path d="M32 10.5 V52"/><path d="M22 56 H42"/><path d="M26 52 H38"/>
        <g class="beam"><path d="M10 16 H54"/></g>
        <g class="pan-l"><path d="M10 16 L4 34 M10 16 L16 34"/><path d="M3 34 H17 Q10 43 3 34 Z"/></g>
        <g class="pan-r"><path d="M54 16 L48 34 M54 16 L60 34"/><path d="M47 34 H61 Q54 43 47 34 Z"/></g>
      </g>
    </svg>
    <div class="ornament" aria-hidden="true"><span></span></div>
    <h1 id="w-title" tabindex="-1" data-focus data-i18n="appName"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <form id="enterForm" novalidate>
      <fieldset class="address">
        <legend><span data-i18n="addressLegend"></span> <small data-i18n="optional"></small></legend>
        <div class="seg">
          <input type="radio" id="addr-m" name="addr" value="m"><label for="addr-m" data-i18n="addrM"></label>
          <input type="radio" id="addr-f" name="addr" value="f"><label for="addr-f" data-i18n="addrF"></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="nameInput" id="nameLabel"></label>
        <input id="nameInput" type="text" autocomplete="nickname" maxlength="40" aria-describedby="nameError">
      </div>
      <p class="form-error" id="nameError" aria-live="polite"></p>
      <div class="identity"><div id="welcomeAvatar"></div><div id="welcomeSign"></div></div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="enterCourt"></button>
    </form>
    <p class="privacy">
      <svg aria-hidden="true"><use href="#lock"/></svg>
      <span data-i18n="privacy"></span>
    </p>
  </section>

  <!-- ===== [2] لماذا يختارك أحد محاميًا؟ ===== -->
  <section class="screen" id="scr-why" aria-labelledby="why-title" hidden>
    <h2 class="h2" id="why-title" tabindex="-1" data-focus data-i18n="whyTitle"></h2>
    <p class="muted" data-i18n="whyIntro"></p>
    <form id="whyForm" novalidate>
      <fieldset>
        <legend class="sr-only" data-i18n="whyTitle"></legend>
        <div class="why-cards" id="whyCards"></div>
      </fieldset>
      <div class="field">
        <label for="whyText" data-i18n="whyTextLabel"></label>
        <textarea id="whyText" maxlength="300"></textarea>
        <span class="hint" id="whyCount"></span>
      </div>
      <p class="form-error" id="whyError" aria-live="polite"></p>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="continue"></button>
    </form>
  </section>

  <!-- ===== [3] تصفح القضايا ===== -->
  <section class="screen wide" id="scr-browse" aria-labelledby="browse-title" hidden>
    <p class="greet" id="greet"></p>
    <div class="section-title">
      <h2 id="browse-title" tabindex="-1" data-focus data-i18n="casesTitle"></h2>
      <span class="count" id="caseCount" aria-live="polite"></span>
    </div>
    <div id="filters"></div>
    <div class="filter-actions"><button class="btn btn-ghost btn-small" id="clearFilters" type="button" data-i18n="clearFilters" hidden></button></div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="emptyState" hidden>
      <p id="emptyText"></p>
      <button class="btn btn-ghost btn-small" id="clearFilters2" type="button" data-i18n="clearFilters"></button>
    </div>
  </section>

  <!-- ===== [4] ملف القضية واختيار الموكّل ===== -->
  <section class="screen" id="scr-case" aria-labelledby="case-title" hidden></section>

  <!-- ===== [5] المحاكمة ===== -->
  <section class="screen" id="scr-trial" aria-labelledby="stageName" hidden></section>

  <!-- ===== [6] النتيجة ===== -->
  <section class="screen wide" id="scr-result" aria-labelledby="result-title" hidden></section>

  <!-- ===== [7] الملف الشخصي ===== -->
  <section class="screen" id="scr-profile" aria-labelledby="profile-title" hidden></section>

</main>

    cv.width = cv.height = VIEW_PX;
    view.appendChild(cv);
    function side() { return Math.min(iw, ih) / zoom; }   /* ضلع المربع المقصوص بوحدات الصورة */
    function clamp() {
      var half = side() / 2;
      cx = Math.min(Math.max(cx, half), iw - half);
      cy = Math.min(Math.max(cy, half), ih - half);
    }
    function paint(canvas, px) {
      var ctx = canvas.getContext('2d'), sd = side();
      ctx.fillStyle = getComputedStyle(root).getPropertyValue('--surface').trim() || '#000';
      ctx.fillRect(0, 0, px, px);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, cx - sd / 2, cy - sd / 2, sd, sd, 0, 0, px, px);
    }
    function redraw() { clamp(); paint(cv, VIEW_PX); }
    var drag = null;
    view.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; try { view.setPointerCapture(e.pointerId); } catch (x) {} });
    view.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var k = side() / (view.clientWidth || 1);   /* بكسل الشاشة ← بكسل الصورة */
      cx -= (e.clientX - drag.x) * k; cy -= (e.clientY - drag.y) * k;
      drag = { x: e.clientX, y: e.clientY };
      redraw();
    });
    function endDrag() { drag = null; }
    view.addEventListener('pointerup', endDrag);
    view.addEventListener('pointercancel', endDrag);
    view.addEventListener('keydown', function (e) {
      var m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!m) return;
      var step = side() / 20;
      e.preventDefault(); cx += m[0] * step; cy += m[1] * step; redraw();
    });
    var range = h('input', { type: 'range', min: '1', max: String(C.PHOTO.zoomMax), step: '0.01', value: '1' });
    range.addEventListener('input', function () { zoom = Number(range.value) || 1; redraw(); });
    view.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoom = Math.min(Math.max(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), 1), C.PHOTO.zoomMax);
      range.value = String(zoom); redraw();
    }, { passive: false });
    function close() {
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      if (opener && opener.isConnected) opener.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      /* حبس التركيز داخل النافذة (aria-modal) */
      var f = Array.prototype.slice.call(overlay.querySelectorAll('button, input, [tabindex="0"]'));
      var i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i < 0 ? 0 : i + (e.shiftKey ? -1 + f.length : 1)) % f.length].focus();
    }
    function accept() {
      var out = document.createElement('canvas');
      out.width = out.height = C.PHOTO.size;
      paint(out, C.PHOTO.size);
      var data = '';
      try { data = out.toDataURL('image/jpeg', C.PHOTO.quality); } catch (e) {}
      close();
      if (!Lg.isPhotoData(data, C.PHOTO.maxStoredChars)) { addNotice('photoBad'); return; }
      photoData = data;
      var stored = false;
      try { if (store) { store.setItem(C.AVATAR_KEY, data); stored = true; } } catch (e) {}
      if (!stored) addNotice('photoNotSaved');
      setAvatar('photo');
    }
    var saveBtn = h('button', { class: 'btn btn-primary', type: 'button', text: t('cropSave'), onclick: accept });
    var overlay = h('div', { class: 'cropper', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cropTitle' }, [
      h('div', { class: 'crop-box' }, [
        h('h3', { id: 'cropTitle', text: t('cropTitle') }),
        h('p', { class: 'muted', style: 'margin:.4rem 0 0;font-size:.9375rem', text: t('cropHint') }),
        view,
        h('label', { class: 'crop-zoom' }, [h('span', { text: t('cropZoom') }), range]),
        h('div', { class: 'btn-row', style: 'justify-content:center' }, [
          saveBtn,
          h('button', { class: 'btn btn-ghost', type: 'button', text: t('cancel'), onclick: close })
        ])
      ])
    ]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    redraw();
    saveBtn.focus();
  }

  /* =================== التوقيع =================== */
  /* لوحة يوقّع فيها اللاعب بالإصبع أو بالماوس؛ التوقيع ينحفظ في جهازه فقط ويطلع على صفحة النتيجة */
  function signaturePad() {
    var W = C.SIGN.w, H = C.SIGN.h;
    var cv = h('canvas', { width: String(W), height: String(H), tabindex: '0', role: 'img', 'aria-label': t('signPad') });
    var ctx = cv.getContext('2d');
    var pad = h('div', { class: 'paper sign-pad' + (signData ? ' has-ink' : '') }, [cv, h('span', { class: 'sign-ph', 'aria-hidden': 'true', text: t('signHere') })]);
    var clearBtn = h('button', { class: 'btn btn-ghost btn-small', type: 'button', text: t('signClear'), hidden: !signData, onclick: function () {
      ctx.clearRect(0, 0, W, H); inked = false; pad.classList.remove('has-ink'); clearBtn.hidden = true;
      storeSign(null); cv.focus();
    } });
    var inked = false;
    if (signData) {
      /* نرسم التوقيع المحفوظ في نص اللوحة */
      var im = new Image();
      im.onload = function () {
        var k = Math.min((W * .84) / im.width, (H * .7) / im.height, 1.6);
        var w = im.width * k, hh = im.height * k;
        ctx.drawImage(im, (W - w) / 2, (H - hh) / 2 - H * .04, w, hh);
        inked = true;
      };
      im.src = signData;
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = C.SIGN.ink; ctx.fillStyle = C.SIGN.ink;
    var last = null, mid = null, lastW = C.SIGN.width;
    function pt(e) {
      var r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, t: e.timeStamp };
    }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      last = pt(e); mid = last; lastW = C.SIGN.width;
      ctx.beginPath(); ctx.arc(last.x, last.y, lastW / 2, 0, Math.PI * 2); ctx.fill();
      if (!inked) { inked = true; pad.classList.add('has-ink'); }
    });
    cv.addEventListener('pointermove', function (e) {
      if (!last) return;
      var p = pt(e);
      var dist = Math.hypot(p.x - last.x, p.y - last.y);
      if (dist < 1.2) return;
      /* الخط يرقّ مع السرعة مثل الحبر الحقيقي */
      var speed = dist / Math.max(1, p.t - last.t);
      var wNow = Math.max(C.SIGN.width * .45, Math.min(C.SIGN.width * 1.3, C.SIGN.width * 1.5 - speed * 1.4));
      lastW = lastW * .6 + wNow * .4;
      var m = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
      ctx.lineWidth = lastW;
      ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.quadraticCurveTo(last.x, last.y, m.x, m.y); ctx.stroke();
      last = p; mid = m;
    });
    function end() {
      if (!last) return;
      last = null; mid = null;
      clearBtn.hidden = false;
      storeSign(exportSign(cv));
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    return h('fieldset', { class: 'sign-pick' }, [
      h('legend', null, [h('span', { text: t('signLegend') }), ' ', h('small', { text: t('optional') })]),
      pad,
      h('div', { class: 'av-actions' }, [clearBtn]),
      h('p', { class: 'av-note' }, [icon('lock'), h('span', { text: t('signPrivacy') })])
    ]);
  }
  /* يقص التوقيع على حدود الحبر ويرجعه PNG شفاف (أو null إذا اللوحة فاضية) */
  function exportSign(cv) {
    var W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data;
    var x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return null;
    var pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
    var out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    var url = '';
    try { url = out.toDataURL('image/png'); } catch (e) {}
    return Lg.isSignData(url, C.SIGN.maxStoredChars) ? url : null;
  }
  function storeSign(url) {
    signData = url;
    var ok = false;
    try { if (store) { if (url) store.setItem(C.SIGN_KEY, url); else store.removeItem(C.SIGN_KEY); ok = true; } } catch (e) {}
    if (!ok && url) addNotice('signNotSaved');
  }
  /* التوقيع المعروض تحت المرافعة في صفحة النتيجة */
  function signedBlock(animate) {
    if (!signData) return null;
    return h('div', { class: 'signed' + (animate ? ' stamp' : '') }, [
      h('p', { class: 'who' }, [t('signedBy') + ' ', h('strong', { text: state.name })]),
      h('div', { class: 'paper' }, [h('img', { src: signData, alt: t('signImg', { name: state.name }), onerror: function () { storeSign(null); this.parentNode.parentNode.remove(); } })])
    ]);
  }

  /* =================== [3] تصفح القضايا =================== */
  var filters = { region: [], tag: [], decade: [] };
  var facets = Lg.buildFacets(CASES, Object.keys(C.REGIONS), Object.keys(C.TAGS));
  function facetLabel(group, v) {
    if (group === 'region') return C.REGIONS[v] ? L(C.REGIONS[v]) : v;
    if (group === 'tag') return C.TAGS[v] ? L(C.TAGS[v]) : v;
    return t('decadeLabel', { d: v });
  }
  function anyFilter() { return filters.region.length + filters.tag.length + filters.decade.length > 0; }
  function clearFilters() { filters = { region: [], tag: [], decade: [] }; renderers.browse(false); }
  $('clearFilters').addEventListener('click', clearFilters);
  $('clearFilters2').addEventListener('click', function () { clearFilters(); $('browse-title').focus(); });

  /* إرجاع التركيز لنفس الزر بعد إعادة رسم الفلاتر */
  function chipIndex(btn) { return [].indexOf.call($('filters').querySelectorAll('.chip'), btn); }
  function refocusChip(k) { var b = $('filters').querySelectorAll('.chip')[k]; if (b) b.focus(); }

  function caseIds() { return CASES.map(function (c) { return c.id; }); }
  function winsNow() { return Lg.countWins(state.completed, C.SCORING.winPercent, caseIds()); }
  function currentTitle() { return Lg.titleFor(winsNow(), state.gender, C.TITLES, CASES.length); }
  function count(n, kind) { return Lg.countPhrase(n, C.COUNTS[kind], state.lang); }

  renderers.browse = function () {
    var wins = winsNow();
    $('greet').textContent = state.name
      ? t('greeting', { name: state.name }) + ' — ' + t('playerLine', { title: L(currentTitle().title), wins: count(wins, 'casesWon') })
      : '';
    /* الفلاتر تتولد من البيانات */
    var fbox = $('filters');
    fbox.textContent = '';
    [['region', 'filterRegion'], ['tag', 'filterTag'], ['decade', 'filterDecade']].forEach(function (pair) {
      var group = pair[0];
      if (!facets[group].length) return;
      var chips = h('div', { class: 'chips' });
      chips.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(!filters[group].length), text: t('all'),
        onclick: function () { var k = chipIndex(this); filters[group] = []; renderers.browse(false); refocusChip(k); } }));
      facets[group].forEach(function (v) {
        var on = filters[group].indexOf(v) >= 0;
        chips.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), text: facetLabel(group, v),
          onclick: function () {
            var k = chipIndex(this);
            var i = filters[group].indexOf(v);
            if (i >= 0) filters[group].splice(i, 1); else filters[group].push(v);
            renderers.browse(false);
            refocusChip(k);
          } }));
      });
      fbox.appendChild(h('fieldset', { class: 'filter-group' }, [h('legend', { text: t(pair[1]) }), chips]));
    });
    var list = Lg.filterCases(CASES, filters);
    $('caseCount').textContent = t('countOf', { n: list.length, total: CASES.length });
    $('clearFilters').hidden = !anyFilter();
    var cards = $('cards');
    cards.textContent = '';
    list.forEach(function (c, i) { cards.appendChild(buildCard(c, i)); });
    $('emptyState').hidden = list.length > 0;
    $('emptyText').textContent = CASES.length ? t('noResults') : t('noCases');
    $('clearFilters2').hidden = !CASES.length;
  };

  function buildCard(c, i) {
    var done = state.completed[c.id];
    var badges = [h('span', { class: 'badge', text: facetLabel('region', c.region) })];
    c.tags.forEach(function (tg) { badges.push(h('span', { class: 'badge', text: facetLabel('tag', tg) })); });
    badges.push(h('span', { class: 'badge year', text: String(c.year) }));

    ]);

    function flip(toBack) {

    return card;
  }

  /* ميلان 3D + لمعة (من النموذج المعتمد) */
  function attachTilt(card) {
    var raf = 0, last = null;
    function apply() {
      raf = 0;
      if (!last) return;
      var r = card.getBoundingClientRect();
      var x = (last.x - r.left) / r.width - 0.5, y = (last.y - r.top) / r.height - 0.5;
      card.style.transform = 'perspective(900px) rotateX(' + (-y * C.MOTION.tiltX).toFixed(2) + 'deg) rotateY(' + (x * C.MOTION.tiltY).toFixed(2) + 'deg)';
    }
    function reset() {
      last = null;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      card.classList.remove('is-tilting');
      card.style.transform = '';
    }
    card.addEventListener('pointermove', function (e) {
      if (reduced() || e.pointerType === 'touch') return;
      last = { x: e.clientX, y: e.clientY };
      card.classList.add('is-tilting');
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
    card.addEventListener('pointerenter', function (e) { if (!reduced() && e.pointerType !== 'touch') restart(card, 'shine'); });
    card.addEventListener('pointerleave', reset);
    card.addEventListener('pointerdown', function (e) {
      if (reduced() || e.pointerType !== 'touch') return;
      last = { x: e.clientX, y: e.clientY }; apply(); restart(card, 'shine');
    }, { passive: true });
    card.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') reset(); });
    card.addEventListener('pointercancel', reset);
  }

  /* =================== [4] ملف القضية =================== */

      h('dl', { class: 'facts-dl', style: 'margin-top:.75rem' }, [
        h('div', null, [h('dt', { text: t('court') }), h('dd', { loc: c.court })]),
        h('div', null, [h('dt', { text: t('country') }), h('dd', { loc: c.country })]),
        h('div', null, [h('dt', { text: t('parties') }), h('dd', null, [put(h('span'), c.parties.A.name), ' ' + t('versus') + ' ', put(h('span'), c.parties.B.name)])])
      ]),
      h('div', { class: 'panel' }, [h('h3', { text: t('facts') }), h('p', { loc: c.facts })]),
      h('div', { class: 'panel' }, [h('h3', { text: t('evidence') }), h('ul', { class: 'ev-list' }, (c.evidence || []).map(function (ev) {

      }))]),

    ].forEach(function (n) { if (n) scr.appendChild(n); });
