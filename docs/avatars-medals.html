<style>
  /* نفس متغيرات index.html (:root و html[data-theme="gold"]) */
  .t-wine { --bg:#1E0A0E; --surface:#2E1015; --surface-2:#3D161D; --wine:#6B1E2A; --gold:#C9A961; --gold-line:#8C7340; --text:#F3EBDD; --text-muted:#C9B9A6; }
  .t-gold { --bg:#F3E3B8; --surface:#FBF1D6; --surface-2:#EFD9A0; --wine:#E2C084; --gold:#7A1F2E; --gold-line:#9C7438; --text:#4A0F1A; --text-muted:#6E2A35; }
  body { margin:0; font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; }
  section { background:radial-gradient(ellipse at top, var(--surface) 0%, var(--bg) 60%), var(--bg); color:var(--text); padding:20px; }
  h2 { font-size:17px; margin:0 0 6px; }
  h3 { font-size:13px; margin:14px 0 8px; color:var(--text-muted); font-weight:500; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  figure { margin:0; text-align:center; font-size:11px; width:84px; }
  figcaption { margin-top:4px; }
  /* نفس .avatar في index.html */
  .avatar { display:inline-grid; place-items:center; width:var(--av); height:var(--av); border-radius:50%; overflow:hidden; background:var(--surface-2); color:var(--gold); border:1px solid var(--gold); }
  .avatar svg { display:block; width:100%; height:100%; }
  .s72 { --av:72px; } .s44 { --av:44px; }
  /* نفس خانة الاختيار .av-grid label (مع حالة المختار) */
  .pick { display:grid; place-items:center; width:52px; height:52px; border-radius:50%; overflow:hidden; border:1px solid var(--gold-line); background:var(--surface); color:var(--gold); }
  .pick.on { border:2px solid var(--gold); background:var(--surface-2); box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--gold); }
  .pick svg { display:block; width:100%; height:100%; }
</style>
