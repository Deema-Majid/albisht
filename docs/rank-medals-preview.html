<style>
  /* متغيرات الثيمين منسوخة من index.html */
  .theme-wine {
    --bg: #1E0A0E; --surface: #2E1015; --surface-2: #3D161D; --wine: #6B1E2A;
    --gold: #C9A961; --gold-hover: #D4B774; --gold-line: #8C7340;
    --text: #F3EBDD; --text-muted: #C9B9A6; --on-gold: #1E0A0E;
    --good: #9CC9A3; --weak: #E8A0A0;
    --frame: rgba(201,169,97,.18); --shadow: rgba(0,0,0,.35); --shine: rgba(232,205,140,.22);
  }
  .theme-gold {
    --bg: #F3E3B8; --surface: #FBF1D6; --surface-2: #EFD9A0; --wine: #E2C084;
    --gold: #7A1F2E; --gold-hover: #8E2536; --gold-line: #9C7438;
    --text: #4A0F1A; --text-muted: #6E2A35; --on-gold: #FBF1D6;
    --good: #2E6B3A; --weak: #9E1B1B;
    --frame: rgba(122,31,46,.16); --shadow: rgba(74,15,26,.18); --shine: rgba(255,255,255,.55);
  }
  :root {
    --font-head: "Amiri", "Traditional Arabic", "Sakkal Majalla", "Times New Roman", serif;
    --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Geeza Pro", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: #120508; }
  section { background: var(--bg); color: var(--text); padding: 1.5rem 1rem 2rem; border-bottom: 1px solid var(--frame); }
  h1, h2 { font-family: var(--font-head); color: var(--gold); margin: 0 0 1rem; }
  h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; }
  p.note { color: var(--text-muted); margin: 0 0 1rem; font-size: .9rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  figure { margin: 0; width: 140px; padding: .9rem .5rem; text-align: center;
           background: var(--surface); border: 1px solid var(--frame); border-radius: 10px;
           box-shadow: 0 4px 14px var(--shadow); }
  .med { position: relative; display: inline-block; line-height: 0; }
  .med svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .s72 svg { width: 72px; height: 72px; }
  .s44 svg { width: 44px; height: 44px; }
  figcaption { margin-top: .55rem; line-height: 1.4; }
  figcaption b { display: block; font-family: var(--font-head); font-size: 1.05rem; color: var(--gold); }
  figcaption small { color: var(--text-muted); font-size: .8rem; }
  .compact figure { width: auto; padding: .6rem; }
  /* الحالة المقفلة */
  .locked svg.medal { filter: grayscale(1) brightness(.5); }
  .lock-badge { position: absolute; inset: 0; margin: auto; width: 26px; height: 26px; border-radius: 50%;
                background: #C9A961; border: 1.5px solid #5A3F14; color: #2A1206;
                display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .lock-badge svg { width: 15px; height: 15px; filter: none; }
</style>
</head>

  var RANKS = [
    { id: 'av-rank-1', name: 'الرَّق المختوم', title: 'محامٍ/محامية', need: 'بعد قضيتين' },
    { id: 'av-rank-2', name: 'الفانوس',       title: 'محامٍ أول',     need: 'بعد 4 قضايا' },
    { id: 'av-rank-3', name: 'النخلة',        title: 'مستشار',        need: 'بعد 7 قضايا' },
    { id: 'av-rank-4', name: 'الصقر',         title: 'كبير المستشارين', need: 'بعد 10 قضايا' },
    { id: 'av-rank-5', name: 'البشت الملكي',  title: 'أسطورة المرافعة', need: 'بعد كل القضايا' }
  ];
  var tpl = document.getElementById('tpl');
  document.querySelectorAll('[data-row]').forEach(function (row) {
    var kind = row.getAttribute('data-row');
    RANKS.forEach(function (r) {
      var f = tpl.content.firstElementChild.cloneNode(true);
      var svg = f.querySelector('svg');
      svg.querySelector('use').setAttribute('href', '#' + r.id);
      svg.setAttribute('aria-label', 'وسام ' + r.name + (kind === 'locked' ? ' (مقفل)' : ''));
      f.querySelector('b').textContent = r.name;
      f.querySelector('small').textContent = r.title + ' — ' + r.need;
      if (kind === 'small') f.querySelector('figcaption').remove();
      if (kind === 'locked') {
        f.classList.add('locked');
        var badge = document.createElement('span');
        badge.className = 'lock-badge';
        badge.innerHTML = '<svg aria-hidden="true"><use href="#lock"/></svg>';
        f.querySelector('.med').appendChild(badge);
      }
      row.appendChild(f);
    });
  });
</script>
</body>
</html>
